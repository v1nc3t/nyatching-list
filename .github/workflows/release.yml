name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
        required: true

permissions:
  contents: write

concurrency: release

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    env:
      VITE_TMDB_READ_TOKEN: ${{ secrets.VITE_TMDB_READ_TOKEN }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify TMDB token
        run: |
          if [ -z "$VITE_TMDB_READ_TOKEN" ]; then
            echo "Set the VITE_TMDB_READ_TOKEN repository secret before releasing."
            exit 1
          fi

      # manifest version is read from package.json
      - name: Bump version
        id: bump
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          npm version "$BUMP" --no-git-tag-version
          echo "version=$(npm pkg get version | tr -d '"')" >> "$GITHUB_OUTPUT"

      # builds both Chrome (build/) and Firefox (build-firefox/)
      - name: Build
        run: npm run build

      - name: Zip
        run: |
          cd build && zip -r ../nyatching-chrome.zip * && cd ..
          cd build-firefox && zip -r ../nyatching-firefox.zip * && cd ..
          zip -r source-code.zip . -x "node_modules/*" -x ".git/*" -x "build/*" -x "build-firefox/*" -x "*.zip" -x ".env" -x ".env.local"

      # after the build, so a failed build pushes nothing
      - name: Commit and tag
        env:
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -am "chore: release v$VERSION"
          git tag "v$VERSION"
          git push --atomic origin HEAD:main "v$VERSION"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.bump.outputs.version }}
          files: |
            nyatching-chrome.zip
            nyatching-firefox.zip
            source-code.zip
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
